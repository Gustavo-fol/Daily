<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✍ Diário Pessoal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">

  <div class="container">
    <h1>✍ Diário Pessoal</h1>

    <!-- NAVBAR -->
    <nav class="navbar">
      <button id="btnHome"   class="ativo">✍ Nova Anotação</button>
      <button id="btnDiario">📖 Meu Diário</button>
      <button id="btnConfig">⚙ Configurações</button>
    </nav>

    <!-- FORMULÁRIO -->
    <div class="form-box">
      <label for="data">Data</label>
      <input type="date" id="data">

      <label for="texto">Anotação</label>
      <textarea id="texto" placeholder="Escreva seus pensamentos aqui..."></textarea>

      <button id="btnSalvar">💾 Salvar Anotação</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- SCRIPTS (ordem importa) -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
