<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙ Configurações</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">

  <div class="container">
    <h1>⚙ Configurações</h1>

    <!-- NAVBAR -->
    <nav class="navbar">
      <button id="btnHome">✍ Nova Anotação</button>
      <button id="btnDiario">📖 Meu Diário</button>
      <button id="btnConfig" class="ativo">⚙ Configurações</button>
    </nav>

    <!-- TEMAS -->
    <div class="card">
      <h2>🎨 Escolha um tema</h2>
      <div class="tema-container">
        <button class="tema-btn" data-tema="dark">🌙 Escuro</button>
        <button class="tema-btn" data-tema="light">☀️ Claro</button>
        <button class="tema-btn" data-tema="relax">🌊 Relaxante</button>
      </div>
    </div>

    <!-- FUNDO PADRÃO -->
    <div class="card">
      <h2>🖼 Fundo padrão</h2>
      <select id="fundoPadrao">
        <option value="nenhum">Nenhum</option>
        <option value="papel">📄 Papel</option>
        <option value="flores">🌸 Flores</option>
        <option value="galaxia">🌌 Galáxia</option>
        <option value="natureza">🌲 Natureza</option>
        <option value="oceano">🌊 Oceano</option>
      </select>
    </div>

    <!-- BOTÕES -->
    <div class="acoes-config">
      <button id="btnSalvarConfig">💾 Salvar Configurações</button>
      <button id="btnVoltar">← Voltar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- SCRIPTS -->
  <script src="js/utils.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
