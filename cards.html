<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Meu Diário</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cards.css"
</head>
<body class="dark">

  <div class="container">
    <h1>📖 Meu Diário</h1>
    <p id="contador"></p>

    <!-- NAVBAR -->
    <nav class="navbar">
      <button id="btnHome">✍ Nova Anotação</button>
      <button id="btnDiario" class="ativo">📖 Meu Diário</button>
      <button id="btnConfig">⚙ Configurações</button>
    </nav>

    <!-- BUSCA -->
    <div class="form-busca">
      <input type="search" id="search" placeholder="🔍 Buscar anotações...">
    </div>

    <!--ORDENAR-->
    <div class="btn-ordenar">
    <button onclick="ordenar('recente')" id="btn-recente" class="sort-btn active">
    Mais recente
    </button>
    <button onclick="ordenar('antiga')" id="btn-antiga" class="sort-btn">
    Mais antiga
    </button>
    </div>


    <!-- LISTA -->
    <div id="lista"></div>
  </div>

  <!-- MODAL EDIÇÃO -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2>✏️ Editar Anotação</h2>
      <label for="modalData">Data</label>
      <input type="date" id="modalData">
      <label for="modalTexto">Anotação</label>
      <textarea id="modalTexto" style="min-height:120px"></textarea>
      <div class="modal-acoes">
        <button class="btn-secundario" id="modalCancelar">Cancelar</button>
        <button id="modalSalvar" style="background:var(--green);color:#fff">💾 Salvar</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM EXCLUSÃO -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h2>🗑️ Excluir</h2>
      <p>Tem certeza que deseja excluir esta anotação?</p>
      <div class="confirm-acoes">
        <button class="btn-secundario" id="confirmNao">Cancelar</button>
        <button id="confirmSim" style="background:var(--red);color:#fff">Excluir</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- SCRIPTS -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/busca.js"></script>
  <script src="js/render.js"></script>
  <script src="js/cards.js"></script>
</body>
</html>
